<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>伊豆・贅沢ヴィラ旅 しおり</title>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #fdfdfc;
    color: #333;
  }
  .mobile-wrapper {
    max-width: 480px;
    margin: 0 auto;
    background-color: #ffffff;
    min-height: 100vh;
    padding-bottom: 80px;
    box-shadow: 0 0 20px rgba(0,0,0,0.05);
    position: relative;
  }
  
  .main-header {
    background: #ffffff;
    padding: 15px 20px 5px;
    border-bottom: 1px solid #eaeaea;
  }
  .main-header h1 { margin: 0; font-size: 18px; font-weight: 800; color: #2c3e50;}
  .main-header p { margin: 2px 0 0; font-size: 11px; color: #777;}
  
  .day-badge {
    color: #a87e4f;
    font-size: 13px;
    font-weight: bold;
    margin: 15px 20px 5px;
  }

  .app-card {
    background: #ffffff;
    border-radius: 12px;
    margin: 0 15px 20px;
    padding: 15px;
    border: 1px solid #eaeaea;
    scroll-margin-top: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }

  .spot-header {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    color: #2c3e50;
  }
  .spot-icon { font-size: 16px; margin-right: 6px; }
  .spot-time { font-size: 14px; font-weight: 800; margin-right: 8px; }
  .spot-title { font-size: 16px; font-weight: bold; }

  /* カルーセル（写真） */
  .carousel-outer { margin-bottom: 12px; }
  .carousel-wrapper {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .carousel-wrapper::-webkit-scrollbar { display: none; }
  
  .carousel-item {
    flex: 0 0 calc(100% - 16px);
    scroll-snap-align: center;
    position: relative;
    height: 180px;
    border-radius: 8px;
    overflow: hidden;
    background-color: #f0f0f0;
  }
  .carousel-item.half { flex: 0 0 80%; }
  
  .carousel-item img, .carousel-item svg { width: 100%; height: 100%; object-fit: cover; }
  
  .carousel-label {
    position: absolute;
    bottom: 8px;
    left: 10px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    backdrop-filter: blur(2px);
  }

  .swipe-hint {
    text-align: center;
    font-size: 10px;
    color: #888;
    margin-top: 5px;
  }

  .info-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
  .info-table td { padding: 8px 4px; font-size: 12px; vertical-align: top; border-bottom: 1px dashed #f2f2f2; }
  .info-table tr:last-child td { border-bottom: none; }
  .info-table td.label { width: 85px; color: #888; font-weight: normal; }
  .info-table td.value { color: #333; line-height: 1.5; }
  .info-table a { color: #4285F4; text-decoration: none; font-weight: bold; }

  /* 夕食候補 */
  .dinner-choice { border-top: 1px solid #f2f2f2; padding: 10px 0; }
  .dinner-choice:first-child { border-top: none; }
  .dinner-choice-title { font-size: 13px; font-weight: bold; color: #2c3e50; margin-bottom: 3px; }
  .dinner-choice-desc { font-size: 11px; color: #666; line-height: 1.4; margin-bottom: 5px;}
  .map-btn-small {
    display: inline-block;
    background-color: #eef3f9;
    color: #4285F4;
    padding: 5px 10px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: bold;
    text-decoration: none;
    border: 1px solid #d4e1f4;
  }
